name: Agent release

on:
  push:
    tags: ['agent-v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x
      - name: Build single-file agent
        shell: pwsh
        run: |
          $project = Get-ChildItem agent/src/Uma.Agent.Windows -Filter *.csproj -Recurse | Select-Object -First 1
          if (-not $project) { throw 'Uma.Agent.Windows project is not present; T10 must land before an agent tag is published.' }
          dotnet publish $project.FullName -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: uma-agent-${{ github.ref_name }}
          path: publish/*.exe
          if-no-files-found: error
          retention-days: 90
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" publish/*.exe --generate-notes
